.dg1 .s1{animation:dg1a1 11s ease-in-out infinite both}
.dg1 .s1 .ln{animation:dg1d1 11s ease-in-out infinite both}
@keyframes dg1a2{0%,28.8%{opacity:0;transform:translateY(6px)}33.8%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d2{0%,28.8%{stroke-dashoffset:1}36.8%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s2{animation:dg1a2 11s ease-in-out infinite both}
.dg1 .s2 .ln{animation:dg1d2 11s ease-in-out infinite both}
@keyframes dg1a3{0%,41.2%{opacity:0;transform:translateY(6px)}46.2%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d3{0%,41.2%{stroke-dashoffset:1}49.2%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s3{animation:dg1a3 11s ease-in-out infinite both}
.dg1 .s3 .ln{animation:dg1d3 11s ease-in-out infinite both}
@keyframes dg1a4{0%,53.6%{opacity:0;transform:translateY(6px)}58.6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
