.dg1 .s4{animation:dg1a4 11s ease-in-out infinite both}
.dg1 .s4 .ln{animation:dg1d4 11s ease-in-out infinite both}
@keyframes dg1a5{0%,66.0%{opacity:0;transform:translateY(6px)}71.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
