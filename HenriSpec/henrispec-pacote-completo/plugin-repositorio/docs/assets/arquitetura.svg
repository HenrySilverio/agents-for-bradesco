<svg xmlns="http://www.w3.org/2000/svg" class="dg1" viewBox="0 0 930 230" role="img" aria-label="Do seu repositório ao repositório do produto"><title>Do seu repositório ao repositório do produto</title>
<style>.dg1 text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif}
.dg1 .t{font-size:14px;font-weight:650;fill:#f0f1f5}
.dg1 .st{font-size:11.5px;font-family:"Cascadia Mono",Consolas,monospace}
.dg1 .el{font-size:11.5px;fill:#a7a8ac;font-family:"Cascadia Mono",Consolas,monospace}
.dg1 .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg1 .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg1 .pulso{animation:dg1pulse 2.4s ease-in-out infinite}
@keyframes dg1pulse{0%,100%{stroke:#cc092f}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
.dg1 .pulso-a{animation:dg1pulsea 2.4s ease-in-out infinite}
@keyframes dg1pulsea{0%,100%{stroke:#e1173f}50%{stroke:#ffbc00;filter:drop-shadow(0 0 6px rgba(255,188,0,.6))}}
@keyframes dg1a0{0%,4.0%{opacity:0;transform:translateY(6px)}9.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d0{0%,4.0%{stroke-dashoffset:1}12.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s0{animation:dg1a0 11s ease-in-out infinite both}
.dg1 .s0 .ln{animation:dg1d0 11s ease-in-out infinite both}
@keyframes dg1a1{0%,16.4%{opacity:0;transform:translateY(6px)}21.4%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
