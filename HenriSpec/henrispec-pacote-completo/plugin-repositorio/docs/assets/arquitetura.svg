.dg1 .s5{animation:dg1a5 11s ease-in-out infinite both}
.dg1 .s5 .ln{animation:dg1d5 11s ease-in-out infinite both}
@media (prefers-reduced-motion:reduce){.dg1 *{animation:none!important}.dg1 .ln{stroke-dashoffset:0}.dg1 .pac{display:none}}</style><defs>
