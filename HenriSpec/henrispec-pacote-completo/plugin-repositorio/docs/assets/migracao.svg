.dg1 .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg1 .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg1 .pulso{animation:dg1pulse 2.4s ease-in-out infinite}
@keyframes dg1pulse{0%,100%{stroke:#cc092f}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
