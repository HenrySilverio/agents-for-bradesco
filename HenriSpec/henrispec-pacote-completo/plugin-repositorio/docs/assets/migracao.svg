<svg xmlns="http://www.w3.org/2000/svg" class="dg1" viewBox="0 0 1010 230" role="img" aria-label="Repositório com cópia antiga do toolkit migrando para o plugin"><title>Repositório com cópia antiga do toolkit migrando para o plugin</title>
<style>.dg1 text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif}
.dg1 .t{font-size:14px;font-weight:650;fill:#f0f1f5}
