<svg xmlns="http://www.w3.org/2000/svg" class="dg1" viewBox="0 0 1110 330" role="img" aria-label="Triagem: o ticket mapeado por seção"><title>Triagem: o ticket mapeado por seção</title>
<style>.dg1 text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif}
.dg1 .t{font-size:14px;font-weight:650;fill:#f0f1f5}
.dg1 .st{font-size:11.5px;font-family:"Cascadia Mono",Consolas,monospace}
.dg1 .el{font-size:11.5px;fill:#a7a8ac;font-family:"Cascadia Mono",Consolas,monospace}
.dg1 .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg1 .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg1 .pulso{animation:dg1pulse 2.4s ease-in-out infinite}
@keyframes dg1pulse{0%,100%{stroke:#cc092f}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
.dg1 .pulso-a{animation:dg1pulsea 2.4s ease-in-out infinite}
@keyframes dg1pulsea{0%,100%{stroke:#e1173f}50%{stroke:#ffbc00;filter:drop-shadow(0 0 6px rgba(255,188,0,.6))}}
@keyframes dg1a0{0%,4.0%{opacity:0;transform:translateY(6px)}9.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d0{0%,4.0%{stroke-dashoffset:1}12.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s0{animation:dg1a0 11s ease-in-out infinite both}
.dg1 .s0 .ln{animation:dg1d0 11s ease-in-out infinite both}
@keyframes dg1a1{0%,19.5%{opacity:0;transform:translateY(6px)}24.5%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d1{0%,19.5%{stroke-dashoffset:1}27.5%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s1{animation:dg1a1 11s ease-in-out infinite both}
.dg1 .s1 .ln{animation:dg1d1 11s ease-in-out infinite both}
@keyframes dg1a2{0%,35.0%{opacity:0;transform:translateY(6px)}40.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d2{0%,35.0%{stroke-dashoffset:1}43.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s2{animation:dg1a2 11s ease-in-out infinite both}
.dg1 .s2 .ln{animation:dg1d2 11s ease-in-out infinite both}
@keyframes dg1a3{0%,50.5%{opacity:0;transform:translateY(6px)}55.5%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d3{0%,50.5%{stroke-dashoffset:1}58.5%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s3{animation:dg1a3 11s ease-in-out infinite both}
.dg1 .s3 .ln{animation:dg1d3 11s ease-in-out infinite both}
@keyframes dg1a4{0%,66.0%{opacity:0;transform:translateY(6px)}71.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg1d4{0%,66.0%{stroke-dashoffset:1}74.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg1 .s4{animation:dg1a4 11s ease-in-out infinite both}
.dg1 .s4 .ln{animation:dg1d4 11s ease-in-out infinite both}
@media (prefers-reduced-motion:reduce){.dg1 *{animation:none!important}.dg1 .ln{stroke-dashoffset:0}.dg1 .pac{display:none}}</style><defs>
<marker id="dg1-mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cc092f"/></marker>
