.dg-fluxo .s4{animation:dg-fluxoa4 11s ease-in-out infinite both}
.dg-fluxo .s4 .ln{animation:dg-fluxod4 11s ease-in-out infinite both}
@keyframes dg-fluxoa5{0%,48.3%{opacity:0;transform:translateY(6px)}53.3%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod5{0%,48.3%{stroke-dashoffset:1}56.3%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s5{animation:dg-fluxoa5 11s ease-in-out infinite both}
.dg-fluxo .s5 .ln{animation:dg-fluxod5 11s ease-in-out infinite both}
