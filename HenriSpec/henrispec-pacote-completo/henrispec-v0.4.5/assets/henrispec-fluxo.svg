<svg xmlns="http://www.w3.org/2000/svg" class="dg-fluxo" viewBox="0 0 1000 290" role="img" aria-label="Fluxo HenriSpec do briefing ao arquivamento"><title>Fluxo HenriSpec do briefing ao arquivamento</title>
<style>
.dg-fluxo text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.dg-fluxo .t{font-size:14px;font-weight:650;fill:#f0f1f5}
.dg-fluxo .st{font-size:11.5px;font-family:"Cascadia Mono",Consolas,monospace}
.dg-fluxo .el{font-size:11.5px;fill:#a7a8ac;font-family:"Cascadia Mono",Consolas,monospace}
.dg-fluxo .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg-fluxo .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg-fluxo .pulso{animation:dg-fluxopulse 2.4s ease-in-out infinite}
@keyframes dg-fluxopulse{0%,100%{stroke:#cc092f;filter:none}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
.dg-fluxo .pulso-a{animation:dg-fluxopulsea 2.4s ease-in-out infinite}
@keyframes dg-fluxopulsea{0%,100%{stroke:#e1173f}50%{stroke:#ffbc00;filter:drop-shadow(0 0 6px rgba(255,188,0,.6))}}
@keyframes dg-fluxoa0{0%,4.0%{opacity:0;transform:translateY(6px)}9.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod0{0%,4.0%{stroke-dashoffset:1}12.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s0{animation:dg-fluxoa0 11s ease-in-out infinite both}
.dg-fluxo .s0 .ln{animation:dg-fluxod0 11s ease-in-out infinite both}
@keyframes dg-fluxoa1{0%,12.9%{opacity:0;transform:translateY(6px)}17.9%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod1{0%,12.9%{stroke-dashoffset:1}20.9%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s1{animation:dg-fluxoa1 11s ease-in-out infinite both}
.dg-fluxo .s1 .ln{animation:dg-fluxod1 11s ease-in-out infinite both}
@keyframes dg-fluxoa2{0%,21.7%{opacity:0;transform:translateY(6px)}26.7%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod2{0%,21.7%{stroke-dashoffset:1}29.7%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s2{animation:dg-fluxoa2 11s ease-in-out infinite both}
.dg-fluxo .s2 .ln{animation:dg-fluxod2 11s ease-in-out infinite both}
@keyframes dg-fluxoa3{0%,30.6%{opacity:0;transform:translateY(6px)}35.6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod3{0%,30.6%{stroke-dashoffset:1}38.6%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s3{animation:dg-fluxoa3 11s ease-in-out infinite both}
