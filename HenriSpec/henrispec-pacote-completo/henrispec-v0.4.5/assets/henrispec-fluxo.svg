@keyframes dg-fluxod6{0%,57.1%{stroke-dashoffset:1}65.1%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s6{animation:dg-fluxoa6 11s ease-in-out infinite both}
.dg-fluxo .s6 .ln{animation:dg-fluxod6 11s ease-in-out infinite both}
@keyframes dg-fluxoa7{0%,66.0%{opacity:0;transform:translateY(6px)}71.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-fluxod7{0%,66.0%{stroke-dashoffset:1}74.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-fluxo .s7{animation:dg-fluxoa7 11s ease-in-out infinite both}
.dg-fluxo .s7 .ln{animation:dg-fluxod7 11s ease-in-out infinite both}
@media (prefers-reduced-motion:reduce){.dg-fluxo *{animation:none!important}.dg-fluxo .ln{stroke-dashoffset:0}.dg-fluxo .pac{display:none}}
