<text class="st" x="880.0" y="234.0" text-anchor="middle" fill="#ffcf4d">prompt para o Copilot</text>
</g>
<g class="s6">
<rect x="780" y="30" width="200" height="58" rx="12" fill="#0c2016" stroke="#09ab47" stroke-width="1.8"/>
<text class="t" x="880.0" y="56.0" text-anchor="middle">commit</text>
<text class="st" x="880.0" y="74.0" text-anchor="middle" fill="#57d98b">.github .sdd docs</text>
</g>
