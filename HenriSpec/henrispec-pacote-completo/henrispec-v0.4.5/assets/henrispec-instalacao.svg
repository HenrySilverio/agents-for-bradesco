<text class="st" x="685.0" y="234.0" text-anchor="middle" fill="#8fb0ff">toolkit.lock.json</text>
</g>
<g class="s5">
<rect x="780" y="190" width="200" height="58" rx="12" fill="#2b2207" stroke="#ffbc00" stroke-width="1.8"/>
