<circle class="pac" r="3.6" fill="#ffbc00"><animateMotion dur="2.2s" begin="1.05s" repeatCount="indefinite"><mpath href="#dg-inst-e3"/></animateMotion></circle>
</g>
<g class="s3">
<path id="dg-inst-e4" class="ln" pathLength="1" d="M685 88V140H485V188" stroke="#ffbc00" marker-end="url(#dg-inst-ma)"/>
<circle class="pac" r="3.6" fill="#ffbc00"><animateMotion dur="2.2s" begin="1.40s" repeatCount="indefinite"><mpath href="#dg-inst-e4"/></animateMotion></circle>
</g>
<g class="s4">
<path id="dg-inst-e5" class="ln" pathLength="1" d="M580 219.0H608" stroke="#cc092f" marker-end="url(#dg-inst-mr)"/>
<circle class="pac" r="3.6" fill="#cc092f"><animateMotion dur="2.2s" begin="0.00s" repeatCount="indefinite"><mpath href="#dg-inst-e5"/></animateMotion></circle>
</g>
<g class="s5">
<path id="dg-inst-e6" class="ln" pathLength="1" d="M760 219.0H778" stroke="#cc092f" marker-end="url(#dg-inst-mr)"/>
<circle class="pac" r="3.6" fill="#cc092f"><animateMotion dur="2.2s" begin="0.35s" repeatCount="indefinite"><mpath href="#dg-inst-e6"/></animateMotion></circle>
</g>
<g class="s6">
<path id="dg-inst-e7" class="ln" pathLength="1" d="M880 190V90" stroke="#09ab47" marker-end="url(#dg-inst-mg)"/>
<circle class="pac" r="3.6" fill="#09ab47"><animateMotion dur="2.2s" begin="0.70s" repeatCount="indefinite"><mpath href="#dg-inst-e7"/></animateMotion></circle>
</g>
<g class="s0">
<rect x="20" y="110" width="150" height="58" rx="12" fill="#1c1c1e" stroke="#5b5c61" stroke-width="1.8"/>
<text class="t" x="95.0" y="136.0" text-anchor="middle">pacote HenriSpec</text>
<text class="st" x="95.0" y="154.0" text-anchor="middle" fill="#a7a8ac">baixado na máquina</text>
</g>
