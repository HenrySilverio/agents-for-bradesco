<text class="t" x="485.0" y="56.0" text-anchor="middle">CONFLITO</text>
<text class="st" x="485.0" y="74.0" text-anchor="middle" fill="#ff8197">alterado à mão</text>
</g>
<g class="s3">
<rect x="610" y="30" width="150" height="58" rx="12" fill="#2b2207" stroke="#ffbc00" stroke-width="1.8"/>
