<svg xmlns="http://www.w3.org/2000/svg" class="dg-inst" viewBox="0 0 1000 270" role="img" aria-label="Instalação e atualização do HenriSpec"><title>Instalação e atualização do HenriSpec</title>
<style>
.dg-inst text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.dg-inst .t{font-size:14px;font-weight:650;fill:#f0f1f5}
.dg-inst .st{font-size:11.5px;font-family:"Cascadia Mono",Consolas,monospace}
.dg-inst .el{font-size:11.5px;fill:#a7a8ac;font-family:"Cascadia Mono",Consolas,monospace}
.dg-inst .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg-inst .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg-inst .pulso{animation:dg-instpulse 2.4s ease-in-out infinite}
@keyframes dg-instpulse{0%,100%{stroke:#cc092f;filter:none}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
.dg-inst .pulso-a{animation:dg-instpulsea 2.4s ease-in-out infinite}
@keyframes dg-instpulsea{0%,100%{stroke:#e1173f}50%{stroke:#ffbc00;filter:drop-shadow(0 0 6px rgba(255,188,0,.6))}}
@keyframes dg-insta0{0%,4.0%{opacity:0;transform:translateY(6px)}9.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd0{0%,4.0%{stroke-dashoffset:1}12.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s0{animation:dg-insta0 11s ease-in-out infinite both}
.dg-inst .s0 .ln{animation:dg-instd0 11s ease-in-out infinite both}
@keyframes dg-insta1{0%,14.3%{opacity:0;transform:translateY(6px)}19.3%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd1{0%,14.3%{stroke-dashoffset:1}22.3%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s1{animation:dg-insta1 11s ease-in-out infinite both}
.dg-inst .s1 .ln{animation:dg-instd1 11s ease-in-out infinite both}
@keyframes dg-insta2{0%,24.7%{opacity:0;transform:translateY(6px)}29.7%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd2{0%,24.7%{stroke-dashoffset:1}32.7%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s2{animation:dg-insta2 11s ease-in-out infinite both}
.dg-inst .s2 .ln{animation:dg-instd2 11s ease-in-out infinite both}
@keyframes dg-insta3{0%,35.0%{opacity:0;transform:translateY(6px)}40.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd3{0%,35.0%{stroke-dashoffset:1}43.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s3{animation:dg-insta3 11s ease-in-out infinite both}
.dg-inst .s3 .ln{animation:dg-instd3 11s ease-in-out infinite both}
@keyframes dg-insta4{0%,45.3%{opacity:0;transform:translateY(6px)}50.3%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd4{0%,45.3%{stroke-dashoffset:1}53.3%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s4{animation:dg-insta4 11s ease-in-out infinite both}
.dg-inst .s4 .ln{animation:dg-instd4 11s ease-in-out infinite both}
@keyframes dg-insta5{0%,55.7%{opacity:0;transform:translateY(6px)}60.7%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd5{0%,55.7%{stroke-dashoffset:1}63.7%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s5{animation:dg-insta5 11s ease-in-out infinite both}
.dg-inst .s5 .ln{animation:dg-instd5 11s ease-in-out infinite both}
@keyframes dg-insta6{0%,66.0%{opacity:0;transform:translateY(6px)}71.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-instd6{0%,66.0%{stroke-dashoffset:1}74.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-inst .s6{animation:dg-insta6 11s ease-in-out infinite both}
.dg-inst .s6 .ln{animation:dg-instd6 11s ease-in-out infinite both}
@media (prefers-reduced-motion:reduce){.dg-inst *{animation:none!important}.dg-inst .ln{stroke-dashoffset:0}.dg-inst .pac{display:none}}
</style>
<defs>
<marker id="dg-inst-mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cc092f"/></marker>
<marker id="dg-inst-ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffbc00"/></marker>
<marker id="dg-inst-mc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b5c61"/></marker>
<marker id="dg-inst-mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b69ff"/></marker>
<marker id="dg-inst-mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#09ab47"/></marker>
<marker id="dg-inst-mx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e1173f"/></marker>
</defs>
<rect width="1000" height="270" rx="18" fill="#121212"/>
<g class="s1">
