@keyframes dg-consomea0{0%,4.0%{opacity:0;transform:translateY(6px)}9.0%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-consomed0{0%,4.0%{stroke-dashoffset:1}12.0%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-consome .s0{animation:dg-consomea0 11s ease-in-out infinite both}
.dg-consome .s0 .ln{animation:dg-consomed0 11s ease-in-out infinite both}
