<svg xmlns="http://www.w3.org/2000/svg" class="dg-consome" viewBox="0 0 1000 250" role="img" aria-label="Front consumindo endpoint pronto do BFF"><title>Front consumindo endpoint pronto do BFF</title>
<style>
.dg-consome text{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.dg-consome .t{font-size:14px;font-weight:650;fill:#f0f1f5}
.dg-consome .st{font-size:11.5px;font-family:"Cascadia Mono",Consolas,monospace}
.dg-consome .el{font-size:11.5px;fill:#a7a8ac;font-family:"Cascadia Mono",Consolas,monospace}
.dg-consome .ln{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
.dg-consome .tracejada .ln{stroke-dasharray:.02 .015;stroke-dashoffset:0;animation:none!important}
.dg-consome .pulso{animation:dg-consomepulse 2.4s ease-in-out infinite}
@keyframes dg-consomepulse{0%,100%{stroke:#cc092f;filter:none}50%{stroke:#ff6b86;filter:drop-shadow(0 0 6px rgba(225,23,63,.75))}}
