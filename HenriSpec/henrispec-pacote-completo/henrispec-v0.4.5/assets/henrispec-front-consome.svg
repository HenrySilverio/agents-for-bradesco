@keyframes dg-consomed2{0%,28.8%{stroke-dashoffset:1}36.8%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-consome .s2{animation:dg-consomea2 11s ease-in-out infinite both}
.dg-consome .s2 .ln{animation:dg-consomed2 11s ease-in-out infinite both}
@keyframes dg-consomea3{0%,41.2%{opacity:0;transform:translateY(6px)}46.2%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes dg-consomed3{0%,41.2%{stroke-dashoffset:1}49.2%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:0}}
.dg-consome .s3{animation:dg-consomea3 11s ease-in-out infinite both}
